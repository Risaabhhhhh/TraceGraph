[project]
name = "chainguard-ml"
version = "0.1.0"
description = "ChainGuard ML pipeline for illicit transaction detection"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "pyyaml>=6.0",
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "pytest-cov>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
